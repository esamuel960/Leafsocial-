<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeafSocial — LeafAudio, Inner Circles &amp; Communities</title>
  <meta name="description" content="LeafSocial combines voice notes, inner circle privacy, hangout polls, and creator spaces in one fast green-and-white social network." />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f2f6f3;
      --surface: #ffffff;
      --surface-soft: #f7faf8;
      --surface-hover: #ebf5ee;
      --input-bg: #f4f7f5;
      --text: #0f172a;
      --muted: #526158;
      --green: #16a34a;
      --green-dark: #15803d;
      --green-deeper: #14532d;
      --green-light: #dcfce7;
      --green-tint: #f0fdf4;
      --border: #dbe5de;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --amber: #d97706;
      --amber-bg: #fef3c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    /* Sticky Top Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      cursor: pointer;
    }

    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 3px 10px rgba(22, 163, 74, 0.28);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-soft);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
    }

    .nav-tab {
      background: transparent;
      border: none;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 8px 14px;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .nav-tab:hover {
      background: var(--surface-hover);
      color: var(--green-dark);
    }

    .nav-tab.active {
      background: var(--green);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.25);
    }

    .badge-count {
      background: var(--danger);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 999px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--green-tint);
      border: 1px solid #bbf7d0;
      padding: 5px 11px 5px 6px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--green-deeper);
      cursor: pointer;
    }

    /* 3-Column App Shell */
    .app-shell {
      max-width: 1180px;
      width: 100%;
      margin: 18px auto;
      padding: 0 16px 36px;
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr) 285px;
      gap: 18px;
      flex: 1;
      align-items: start;
    }

    .sidebar-sticky {
      position: sticky;
      top: 72px;
      display: grid;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    h2 {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text);
    }

    h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .sub {
      color: var(--muted);
      font-size: 0.86rem;
    }

    /* Buttons & Inputs */
    button.btn {
      background: var(--green);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 9px 15px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.08s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button.btn:hover {
      background: var(--green-dark);
    }

    button.btn:active {
      transform: scale(0.98);
    }

    button.btn-soft {
      background: var(--green-light);
      color: var(--green-deeper);
    }

    button.btn-soft:hover {
      background: #bbf7d0;
    }

    button.btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    button.btn-ghost:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    button.btn-danger-soft {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    button.btn-sm {
      padding: 6px 11px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    button.link-btn {
      background: none;
      border: none;
      color: var(--green-dark);
      font-weight: 600;
      font-size: 0.84rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }

    input, textarea, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--green);
      background: #ffffff;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    /* Avatars */
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dcfce7, #86efac);
      color: var(--green-deeper);
      font-weight: 800;
      font-size: 0.9rem;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      position: relative;
    }

    .avatar.sm {
      width: 28px;
      height: 28px;
      font-size: 0.75rem;
    }

    .avatar.lg {
      width: 64px;
      height: 64px;
      font-size: 1.35rem;
    }

    .online-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #22c55e;
      border: 2px solid #ffffff;
    }

    /* Left Rail Navigation & Spaces */
    .rail-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 11px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text);
      transition: background 0.12s;
    }

    .rail-item:hover {
      background: var(--surface-hover);
    }

    .rail-item.active {
      background: var(--green-tint);
      color: var(--green-dark);
      font-weight: 700;
    }

    .pill-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--green-light);
      color: var(--green-deeper);
    }

    .pill-tag.circle {
      background: var(--amber-bg);
      color: #92400e;
    }

    /* Composer */
    .composer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

      width: auto;
      padding: 5px 10
