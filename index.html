<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>LeafSocial — Connect, Share & Grow</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --bg: #f2f5f3;
      --surface: #ffffff;
      --surface-hover: #f7faf8;
      --green-50: #f0fdf4;
      --green-100: #dcfce7;
      --green-200: #bbf7d0;
      --green-500: #22c55e;
      --green-600: #16a34a;
      --green-700: #15803d;
      --green-800: #166534;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ================= NAVBAR ================= */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      height: 62px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--green-700);
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: -0.5px;
      cursor: pointer;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--green-600), var(--green-500));
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
    }

    .search-box {
      position: relative;
      max-width: 260px;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid transparent;
      border-radius: var(--radius-full);
      padding: 9px 16px 9px 36px;
      font-size: 0.9rem;
      color: var(--text-main);
      transition: all 0.2s;
    }

    .search-box input:focus {
      background: var(--surface);
      border-color: var(--green-600);
      outline: none;
      box-shadow: 0 0 0 3px var(--green-100);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.82rem;
      opacity: 0.6;
    }

    .topbar-center {
      display: flex;
      height: 100%;
      gap: 4px;
    }

    .nav-btn {
      background: transparent;
      border: none;
      padding: 0 24px;
      height: 100%;
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--text-sub);
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: color 0.15s, background 0.15s;
    }

    .nav-btn:hover {
      background: var(--surface-hover);
      color: var(--green-700);
    }

    .nav-btn.active {
      color: var(--green-600);
    }

    .nav-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 8px;
      right: 8px;
      height: 3px;
      background: var(--green-600);
      border-radius: 3px 3px 0 0;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex: 1;
    }

    .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      background: var(--bg);
      border: none;
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      cursor: pointer;
      transition: 0.15s;
    }

    .icon-circle:hover {
      background: var(--green-100);
      color: var(--green-700);
    }

    /* ================= LAYOUT ================= */
    .shell {
      max-width: 1340px;
      margin: 20px auto;
      padding: 0 18px 60px;
      display: grid;
      grid-template-columns: 280px minmax(0, 640px) 300px;
      justify-content: space-between;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 1120px) {
      .shell { grid-template-columns: minmax(0, 640px) 290px; justify-content: center; }
      .left-rail { display: none; }
    }

    @media (max-width: 880px) {
      .shell { grid-template-columns: 1fr; max-width: 640px; }
      .right-rail { display: none; }
      .search-box { display: none; }
      .nav-btn { padding: 0 12px; font-size: 0.85rem; }
    }

    .sticky-rail {
      position: sticky;
      top: 80px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .panel-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-sub);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .menu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.93rem;
      color: var(--text-main);
      cursor: pointer;
      transition: 0.15s;
    }

    .menu-row:hover, .menu-row.active {
      background: var(--green-50);
      color: var(--green-700);
    }

    .menu-row-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: var(--green-100);
      color: var(--green-800);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: var(--radius-full);
    }

    /* ================= STORIES ================= */
    .stories-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .story {
      height: 175px;
      border-radius: var(--radius-lg);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      font-weight: 700;
      font-size: 0.84rem;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s;
    }

    .story:hover {
      transform: translateY(-3px);
    }

    .story-add {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }

    .story-add-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      background: var(--green-600);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      box-shadow: 0 3px 10px rgba(22, 163, 74, 0.3);
    }

    .story-avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      background: var(--surface);
      color: var(--green-700);
      display: grid;
      place-items: center;
      font-weight: 800;
      border: 3px solid var(--green-500);
    }

    /* ================= AVATAR & COMPOSER ================= */
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--green-100), var(--green-200));
      color: var(--green-800);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .composer-top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .composer-top textarea {
      flex: 1;
      border: none;
      background: var(--bg);
      border-radius: 18px;
      padding: 12px 16px;
      font-size: 0.96rem;
      resize: none;
      min-height: 48px;
      color: var(--text-main);
      transition: 0.2s;
    }

    .composer-top textarea:focus {
      background: var(--surface);
      outline: 2px solid var(--green-500);
    }

    .composer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .media-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill-btn {
      background: transparent;
      border: 1px solid var(--border);
      padding: 7px 13px;
      border-radius: var(--radius-full);
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s;
    }

    .pill-btn:hover {
      background: var(--green-50);
      border-color: var(--green-200);
      color: var(--green-700);
    }

    .pill-btn.active {
      background: var(--green-100);
      border-color: var(--green-500);
      color: var(--green-800);
    }

    .pill-btn.rec {
      background: #fef2f2;
      border-color: #fca5a5;
      color: var(--danger);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    .btn-green {
      background: var(--green-600);
      color: #fff;
      border: none;
